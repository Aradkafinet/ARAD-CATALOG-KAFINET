<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کاتالوگ فیلم و سریال</title>
<style>
:root{
  --bg:#050607; --panel:#0d1012; --panel2:#111518; --line:#202629;
  --text:#f4f6f7; --muted:#9aa2a8; --red:#e50914; --red2:#ff2935;
}
*{box-sizing:border-box}
body{
  margin:0;background:
  radial-gradient(circle at 80% -10%,rgba(229,9,20,.16),transparent 32%),
  radial-gradient(circle at 10% 20%,rgba(255,255,255,.035),transparent 28%),
  var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;
}
a{color:inherit;text-decoration:none}
.shell{max-width:1440px;margin:auto;padding:18px 24px 48px}
.nav{
  height:64px;border:1px solid var(--line);border-radius:16px;background:rgba(9,11,12,.9);
  display:flex;align-items:center;gap:22px;padding:0 18px;position:sticky;top:10px;z-index:10;
  backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.25)
}
.logo{font-weight:900;letter-spacing:.5px;color:#fff;font-size:18px;white-space:nowrap}
.logo b{color:var(--red)}
.navlinks{display:flex;gap:18px;font-size:13px;color:#c9ced1}
.navlinks span{cursor:pointer}
.search{
  margin-right:auto;display:flex;align-items:center;gap:8px;width:min(330px,34vw);
  background:#15191c;border:1px solid #252b2e;border-radius:10px;padding:8px 12px;color:#889096
}
.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;font:inherit}
.hero{
  margin-top:16px;min-height:360px;border-radius:18px;overflow:hidden;position:relative;
  border:1px solid var(--line);background:
  linear-gradient(90deg,rgba(5,6,7,.96) 0%,rgba(5,6,7,.72) 40%,rgba(5,6,7,.16) 100%),
  radial-gradient(circle at 74% 45%,rgba(229,9,20,.18),transparent 26%),
  linear-gradient(135deg,#151a1e,#050607 65%);
}
.hero:after{
  content:"";position:absolute;inset:0;background:
  linear-gradient(135deg,transparent 40%,rgba(255,255,255,.035) 40.2%,transparent 40.8%),
  repeating-linear-gradient(110deg,transparent 0 26px,rgba(255,255,255,.02) 27px,transparent 28px);
  pointer-events:none
}
.hero-inner{position:relative;z-index:1;max-width:720px;padding:52px 54px}
.kicker{display:inline-flex;gap:8px;align-items:center;color:#ff5961;font-size:12px;font-weight:700}
.dot{width:7px;height:7px;background:var(--red);border-radius:50%}
.hero h1{font-size:42px;line-height:1.1;margin:16px 0 6px}
.hero .fa-title{font-size:19px;color:#d6dade;margin-bottom:18px}
.meta{display:flex;gap:9px;flex-wrap:wrap;color:#d3d7d9;font-size:12px}
.badge{border:1px solid #3a4145;background:rgba(255,255,255,.035);padding:5px 9px;border-radius:7px}
.rating{color:#ffd66b;font-weight:700}
.hero p{color:#b9c0c5;line-height:2;font-size:13px;max-width:640px}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}
.primary{background:var(--red);color:#fff}.secondary{background:#1a1f22;color:#e7eaec;border:1px solid #2b3236}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 2px 12px}
.section-head h2{font-size:17px;margin:0}.section-head small{color:#7f898f}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:5px}
.chip{border:1px solid #272d30;background:#101416;color:#adb4b8;border-radius:8px;padding:8px 13px;white-space:nowrap;cursor:pointer;font-size:12px}
.chip.active,.chip:hover{background:var(--red);border-color:var(--red);color:#fff}
.grid{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;
}
.card{
  background:linear-gradient(180deg,#121618,#0b0e10);border:1px solid #1e2427;border-radius:12px;
  overflow:hidden;min-width:0;cursor:pointer;transition:.2s transform,.2s border-color,.2s box-shadow
}
.card:hover{transform:translateY(-5px);border-color:#3a4145;box-shadow:0 16px 30px rgba(0,0,0,.3)}
.poster{
  aspect-ratio:2/3;position:relative;display:flex;align-items:flex-end;padding:0;
  overflow:hidden;background:#101416;
}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster.no-poster{padding:11px;background:
  radial-gradient(circle at 25% 25%,rgba(255,255,255,.18),transparent 25%),
  linear-gradient(145deg,var(--c1),var(--c2));}
.poster:before{
  content:"";position:absolute;inset:-20%;background:
    linear-gradient(120deg,transparent 42%,rgba(255,255,255,.08) 43%,transparent 44%),
    linear-gradient(25deg,transparent 50%,rgba(0,0,0,.28) 51%,transparent 53%);
  transform:rotate(-8deg)
}
.poster-title{position:relative;z-index:1;font-size:16px;line-height:1.25;font-weight:900;text-shadow:0 2px 12px #000}
.year{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:4px 6px;font-size:10px}
.score{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);border-radius:6px;padding:4px 6px;font-size:10px;color:#ffd66b}
.card-body{padding:10px 11px 12px}
.en{font-size:11px;color:#e9edef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.fa{font-size:12px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.genre{color:#788289;font-size:10px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:50px;text-align:center;color:#899297;border:1px dashed #2b3236;border-radius:12px;grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal.show{display:flex}
.modal-box{width:min(760px,100%);background:#0d1012;border:1px solid #2b3236;border-radius:18px;overflow:hidden;box-shadow:0 30px 100px #000}
.modal-poster-wrap{display:flex;justify-content:center;padding:22px 24px 0;background:#0a0c0d}.modal-poster{width:min(220px,55vw);aspect-ratio:2/3;object-fit:cover;border-radius:10px;border:1px solid #2b3236;box-shadow:0 18px 50px rgba(0,0,0,.45)}.modal-title-en{font-size:15px;color:#aeb6bb;margin-top:7px;direction:ltr;text-align:right}.modal-title-fa{font-weight:900;font-size:23px;line-height:1.35}.card-body .en{font-size:11px;color:#e9edef;white-space:normal;overflow:visible;text-overflow:clip;direction:ltr;text-align:right;line-height:1.4}.card-body .fa{font-size:12px;font-weight:700;margin-top:5px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.5}
.modal-top{padding:22px 24px;border-bottom:1px solid #22292c;display:flex;justify-content:space-between;gap:15px}
.close{background:#181d20;color:#fff;border:1px solid #2b3236;border-radius:8px;width:36px;height:36px;cursor:pointer}
.modal-content{padding:24px}.modal-content p{line-height:2;color:#b8c0c5;font-size:13px}
.statrow{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#151a1d;border:1px solid #242b2f;border-radius:9px;padding:8px 11px;font-size:12px}
.footer{color:#697277;text-align:center;font-size:11px;padding:38px 0 5px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.navlinks{display:none}.search{width:45vw}.hero-inner{padding:38px 28px}}
@media(max-width:600px){.shell{padding:10px 10px 35px}.nav{height:58px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero{min-height:330px}.hero h1{font-size:31px}.hero-inner{padding:30px 22px}.search{width:48vw}.nav{gap:10px}}

.category-nav{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 22px}
.category-btn{background:#111517;color:#d9dddf;border:1px solid #2a3033;border-radius:9px;padding:10px 15px;font-size:12px;font-weight:700;cursor:pointer}
.category-btn:hover,.category-btn.active{background:#e50914;border-color:#e50914;color:#fff}
.category-btn.series{font-size:14px;font-weight:900;padding:11px 20px;border-color:#e50914;box-shadow:0 0 0 1px rgba(229,9,20,.25)}
.cat-section{margin:26px 0 34px}
.cat-title{display:flex;align-items:center;justify-content:space-between;border-right:4px solid #e50914;padding:4px 12px 8px 0;margin-bottom:13px}
.cat-title span{font-size:20px;font-weight:900}
.cat-title small{color:#7f898f;font-size:11px}
.show-all{margin-top:14px;background:#171c1f;color:#ddd;border:1px solid #30373a;border-radius:8px;padding:9px 14px;cursor:pointer}
.series-section .cat-title span{font-size:24px;font-weight:1000}

.cat-section{margin:28px 0 40px}
.cat-title{display:flex;align-items:center;justify-content:space-between;border-right:5px solid #e50914;padding:5px 14px 9px 0;margin-bottom:14px}
.cat-title span{font-size:21px;font-weight:900}
.cat-title small{color:#7f898f;font-size:11px}
.series-section{margin-top:52px;padding-top:10px;border-top:1px solid #242a2d}
.series-section .cat-title{border-right-width:7px}
.series-section .cat-title span{font-size:29px;font-weight:1000}

.top-category-nav{
  position:sticky;top:84px;z-index:9;
  display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
  margin:12px 0 16px;padding:9px 10px;
  background:rgba(8,10,11,.94);border:1px solid #252b2e;border-radius:13px;
  backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.22)
}
.top-category-nav a{
  color:#f1f3f4;text-decoration:none;font-size:13px;font-weight:900;
  padding:9px 13px;border-radius:8px;border:1px solid transparent;
  transition:.18s ease;white-space:nowrap
}
.top-category-nav a:hover{
  background:#e50914;border-color:#e50914;color:#fff;transform:translateY(-1px)
}
.top-category-nav .series-link{
  font-size:15px;font-weight:1000;background:#181c1f;border-color:#e50914;color:#fff;
}
html{scroll-behavior:smooth}
.cat-section{scroll-margin-top:145px}
@media(max-width:700px){
  .top-category-nav{top:70px;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
  .top-category-nav a{font-size:12px}
  .cat-section{scroll-margin-top:135px}
}
<style>.featured-showcase{position:relative;margin:8px 0 30px;overflow:hidden;border-radius:18px}.featured-label{display:flex;align-items:center;gap:12px;margin:0 0 10px;padding-right:5px}.featured-label span{font-size:23px;font-weight:1000}.featured-label small{color:#8e989e;font-size:11px}.featured-slider{position:relative;height:390px;border-radius:18px;overflow:hidden;background:#0e1113}.featured-slide{position:absolute;inset:0;opacity:0;transform:scale(1.02);transition:opacity .7s ease,transform 6.5s ease;pointer-events:none}.featured-slide.active{opacity:1;transform:scale(1);pointer-events:auto}.featured-backdrop{position:absolute;inset:0;background:linear-gradient(90deg,#080a0b 0%,rgba(8,10,11,.9) 38%,rgba(8,10,11,.35) 72%,rgba(8,10,11,.15) 100%),var(--slide-bg)}.featured-content{position:absolute;inset:0;display:flex;align-items:flex-end;padding:34px;max-width:760px}.featured-copy{direction:rtl;text-align:right}.featured-kicker{display:inline-block;background:#e50914;color:#fff;border-radius:5px;padding:5px 9px;font-size:10px;font-weight:900;margin-bottom:10px}.featured-fa{font-size:31px;font-weight:1000;line-height:1.2;margin-bottom:5px}.featured-en{font-size:13px;color:#c7cdd0;direction:ltr;text-align:right;margin-bottom:13px}.featured-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.featured-meta span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:5px 8px;border-radius:5px;font-size:10px}.featured-summary{color:#d8dddf;font-size:12px;line-height:1.9;max-width:600px;margin:0}.featured-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.featured-dot{width:7px;height:7px;border:0;border-radius:50%;background:#596166;cursor:pointer;padding:0}.featured-dot.active{width:22px;border-radius:4px;background:#e50914}.featured-arrow{position:absolute;top:55%;transform:translateY(-50%);width:38px;height:52px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(0,0,0,.48);color:#fff;font-size:32px;cursor:pointer;z-index:4}.featured-arrow:hover{background:#e50914}.featured-arrow.prev{right:12px}.featured-arrow.next{left:12px}@media(max-width:700px){.featured-slider{height:420px}.featured-content{padding:22px 18px}.featured-fa{font-size:24px}.featured-summary{font-size:11px}.featured-arrow{display:none}}</style></style>

<body>
<div class="shell">
  <nav class="nav">
    <div class="logo"><b>ARAD</b> CATALOG</div>
    <div class="navlinks">
      <span onclick="setGenre('همه')">خانه</span>
      <span onclick="setGenre('اکشن')">فیلم‌ها</span>
      <span onclick="setGenre('انیمیشن')">انیمیشن</span>
      <span onclick="setGenre('علمی‌تخیلی')">علمی‌تخیلی</span>
    </div>
    <label class="search">⌕ <input id="search" placeholder="جستجوی نام فیلم..." autocomplete="off"></label>
  </nav>
  <section class="featured-showcase"><div class="featured-label"><span>ویژه</span><small>پیشنهاد مدیر</small></div><div class="featured-slider" id="featuredSlider"></div><div class="featured-dots" id="featuredDots"></div><button class="featured-arrow prev" id="featuredPrev">‹</button><button class="featured-arrow next" id="featuredNext">›</button></section><nav class="top-category-nav" aria-label="دسته‌بندی‌ها">
    <a href="#cat-اکشن">اکشن</a>
    <a href="#cat-ماجراجویی">ماجراجویی</a>
    <a href="#cat-علمی‌تخیلی">علمی‌تخیلی</a>
    <a href="#cat-درام">درام</a>
    <a href="#cat-انیمه-و-انیمیشن">انیمه و انیمیشن</a>
    <a href="#cat-هندی">هندی</a>
    <a href="#cat-ترسناک">ترسناک</a>
    <a class="iranian-link" href="#cat-فیلم‌های-ایرانی">فیلم‌های ایرانی</a>
    <a class="series-link" href="#cat-سریال‌ها">سریال‌ها</a>
  </nav>


  <section class="hero">
    <div class="hero-inner">
      <div class="kicker"><span class="dot"></span> پیشنهاد ویژه کاتالوگ</div>
      <h1 id="heroEn"></h1>
      <div class="fa-title" id="heroFa"></div>
      <div class="meta" id="heroMeta"></div>
      <p id="heroDesc"></p>
      <div class="btns">
        <button class="btn primary" onclick="openDetails(featured)">جزئیات</button>
        <button class="btn secondary" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">مشاهده کاتالوگ</button>
      </div>
    </div>
  </section>
  <div class="section-head" id="catalog">
    <h2>فیلم‌ها بر اساس دسته‌بندی</h2>
    <small id="count"></small>
  </div>
  <div id="categorySections"></div>
  <main class="grid" id="grid" style="display:none"></main>



  <div class="footer">کاتالوگ ساخته‌شده بر اساس فایل «عناوین فیلم و سریال با جزئیات»</div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-poster-wrap" id="mPosterWrap"></div>
    <div class="modal-top">
      <div>
        <div id="mFa" class="modal-title-fa"></div>
        <div id="mEn" class="modal-title-en"></div>
      </div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-content">
      <div class="statrow" id="mStats"></div>
      <p id="mDesc"></p>
    </div>
  </div>
</div>

function franchiseKey(title){
  let t=normalizeSearchText(title);
  // Keep known franchises together even when subtitles/parts differ.
  const known=[
    [/^the amazing spider man|^spider man/i,"spider man"],
    [/^resident evil/i,"resident evil"],
    [/^avengers/i,"avengers"],
    [/^captain america/i,"captain america"],
    [/^deadpool/i,"deadpool"],
    [/^john wick/i,"john wick"],
    [/^fast furious/i,"fast furious"],
    [/^transformers/i,"transformers"],
    [/^thor/i,"thor"],
    [/^shrek/i,"shrek"],
    [/^the conjuring/i,"the conjuring"],
    [/^insidious/i,"insidious"],
    [/^alien/i,"alien"],
    [/^avatar/i,"avatar"],
    [/^mission impossible/i,"mission impossible"],
    [/^mortal kombat/i,"mortal kombat"],
    [/^avengers/i,"avengers"],
    [/^hotel transylvania/i,"hotel transylvania"]
  ];
  for(const [re,key] of known) if(re.test(t)) return key;
  // Generic sequel/part handling: strip trailing numbers, Roman numerals and part/chapter labels.
  t=t.replace(/\s*[:\-–—]\s*(chapter|part|قسمت)\s*\d+.*$/i,"")

      .replace(/\s+(i{1,4}|v|vi{0,3}|x{1,3})$/i,"")

function normalizeSearchText(s){
  return String(s ?? "")

    .replace(/[يى]/g,"ی")
    .replace(/ك/g,"ک")
    .replace(/ة/g,"ه")
    .replace(/ۀ/g,"ه")
    .replace(/[أإآٱ]/g,"ا")
    .replace(/[ًٌٍَُِّْـ]/g,"")
    .replace(/[\u200c\u200d]/g," ")
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0)-0x0660))
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0)-0x06f0))

    row[5]  // description
